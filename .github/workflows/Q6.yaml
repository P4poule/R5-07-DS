name: Q6 - Archive avec diff
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*_archive_*.txt'
      - 'Q6_différences.txt'
  workflow_dispatch:

jobs:
  archive-avancee:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Créer la nouvelle archive et le fichier de différences
        run: |
          TIMESTAMP=$(date +%d-%m-%Y-%H%M%S)
          NOUVEAU="Q6_archive_${TIMESTAMP}.txt"

          echo "Nom : Paul Gricourt" > "$NOUVEAU"
          echo "--- Code de Q6.java ---" >> "$NOUVEAU"
          cat Q6.java >> "$NOUVEAU"
          echo "--- Statistiques de Q6.java ---" >> "$NOUVEAU"
          echo "Nombre de lignes : $(wc -l < Q6.java)" >> "$NOUVEAU"
          echo "Nombre de caractères : $(wc -m < Q6.java)" >> "$NOUVEAU"

          PRECEDENT=$(ls -t Q6_archive_*.txt 2>/dev/null | head -n 2 | tail -n 1)

          if [ -n "$PRECEDENT" ] && [ -f "$PRECEDENT" ]; then
            diff "$PRECEDENT" "$NOUVEAU" > Q6_différences.txt || true
          else
            echo "Aucune archive précédente trouvée pour comparaison." > Q6_différences.txt
          fi

      - name: Commit et Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Q6_archive_*.txt Q6_différences.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Q6 - Ajout archive et différences"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep "$attempt"
          done
          exit 1
