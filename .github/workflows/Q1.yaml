name: Q1 - Copie de fichier
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*_archive_*.txt'
      - 'Q6_différences.txt'
  workflow_dispatch:

jobs:
  copie:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Copier le contenu de XYZ.txt
        run: cat XYZ.txt > Q1_archive_XYZ.txt

      - name: Commit et Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Q1_archive_XYZ.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Q1 - Ajout automatique de Q1_archive_XYZ.txt"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep "$attempt"
          done
          exit 1
