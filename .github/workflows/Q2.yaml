name: Q2 - Archive avec métadonnées
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*_archive_*.txt'
      - 'Q6_différences.txt'
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Créer l'archive avec métadonnées
        run: |
          echo "Nom : Paul Gricourt" > Q2_archive_XYZ.txt
          echo "Date d'exécution : $(date)" >> Q2_archive_XYZ.txt
          echo "--- Contenu de XYZ.txt ---" >> Q2_archive_XYZ.txt
          cat XYZ.txt >> Q2_archive_XYZ.txt
          echo "--- Taille de XYZ.txt (en octets) ---" >> Q2_archive_XYZ.txt
          wc -c XYZ.txt >> Q2_archive_XYZ.txt

      - name: Commit et Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Q2_archive_XYZ.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Q2 - Ajout automatique de Q2_archive_XYZ.txt"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep "$attempt"
          done
          exit 1
