name: Q4 - Archive avec date
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*_archive_*.txt'
      - 'Q6_différences.txt'
  workflow_dispatch:

jobs:
  archive-date:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Créer l'archive datée
        run: |
          DATE=$(date +%d-%m-%Y)
          FICHIER="Q4_archive_${DATE}.txt"
          echo "Nom : Paul Gricourt" > "$FICHIER"
          echo "--- Code de Q4.java ---" >> "$FICHIER"
          cat Q4.java >> "$FICHIER"

      - name: Commit et Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Q4_archive_*.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Q4 - Ajout automatique de l'archive datée"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep "$attempt"
          done
          exit 1
