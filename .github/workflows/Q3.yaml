name: Q3 - Archive du code Java
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*_archive_*.txt'
      - 'Q6_différences.txt'
  workflow_dispatch:

jobs:
  archive-java:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Créer l'archive avec le code Java
        run: |
          echo "Nom : Paul Gricourt" > Q3_archive_java.txt
          echo "--- Code de Q3.java ---" >> Q3_archive_java.txt
          cat Q3.java >> Q3_archive_java.txt

      - name: Commit et Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Q3_archive_java.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Q3 - Ajout automatique de Q3_archive_java.txt"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep "$attempt"
          done
          exit 1
